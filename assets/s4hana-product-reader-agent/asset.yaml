apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: s4hana-product-reader-agent
  version: 1.0.0

type: agent

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: s4hana-product-reader-agent
      kind: a2a
      ordId: customer.build:apiResource:s4hana-product-reader-agent-98856.s4hana-product-reader-agent:v1

requires:
  - name: api-product-0002-mcp
    kind: mcp-server
    ordId: sap.s4:apiResource:API_PRODUCT_0002_MCP:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
